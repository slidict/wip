version: 2
updates:
  # NuGet versions are centralised in Directory.Packages.props, which dependabot
  # updates in place together with the project packages.lock.json files. CI restores
  # in locked mode, so dependency PRs must include the regenerated locks.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
