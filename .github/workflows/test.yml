name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the shipping target. ubuntu-latest is where the golden corpus
        # compares in full: it was generated by the Ruby build running inside WSL, so its
        # host-path expectations are Linux paths and those cases skip on Windows (see
        # tests/golden/README.md).
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build wip.slnx --configuration Release

      - name: Run tests
        run: dotnet test tests/Wip.Tests/Wip.Tests.csproj --configuration Release --no-build

  publish:
    name: Native AOT publish
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Publishing is its own job because it is what actually ships, and because the AOT
      # compiler is the only thing that reports trim and reflection problems. TreatWarnings
      # AsErrors is on, so an IL warning fails here rather than reaching a release.
      - name: Publish
        run: >
          dotnet publish src/Wip.Cli/Wip.Cli.csproj
          --configuration Release
          --runtime win-x64
          --output artifacts/win-x64

      # Exercises the published binary, not the test host: the unit suite runs against
      # managed assemblies and cannot catch a problem introduced by AOT compilation itself.
      - name: Smoke test
        shell: pwsh
        run: |
          # Two PowerShell behaviours have to be disarmed before any of this runs.
          #
          # wip reports progress on stderr, the way the Ruby build's `warn` did, and the
          # runner sets $ErrorActionPreference = 'stop' for pwsh steps -- which turns a
          # native command's stderr into a terminating error. So `wip init` announcing that
          # it succeeded would abort the script.
          #
          # The runner also appends `exit $LASTEXITCODE`. The last assertion here runs wip
          # in a directory with no wip.yml and *expects* exit 1, which would then be
          # reported as the step's own result. Hence the explicit `exit 0` at the end.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $wip = Join-Path $env:GITHUB_WORKSPACE "artifacts/win-x64/wip.exe"

          # Merging stderr into the captured output keeps it out of PowerShell's error
          # stream entirely, rather than relying on the preferences above alone.
          function Invoke-Wip([string[]]$WipArgs) {
            $output = & $wip @WipArgs 2>&1 | Out-String
            return [pscustomobject]@{ Code = $LASTEXITCODE; Output = $output }
          }

          $help = Invoke-Wip @('--help')
          if ($help.Code -ne 0) { throw "wip --help exited $($help.Code)" }
          if ($help.Output -notmatch '(?m)^Commands:') { throw "help output is missing its command list" }

          $version = Invoke-Wip @('version')
          if ($version.Output -notmatch '(?m)^wip \d+\.\d+\.\d+\s*$') {
            throw "version output did not look like a version: $($version.Output)"
          }

          # init writes the file config then has to read back, so this covers the YAML
          # writer and loader agreeing with each other on a real filesystem.
          $smoke = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Path $smoke -Force | Out-Null
          Push-Location $smoke
          try {
            $init = Invoke-Wip @('init')
            if ($init.Code -ne 0) { throw "wip init failed: $($init.Output)" }

            $config = Invoke-Wip @('config')
            if ($config.Code -ne 0) {
              throw "wip config could not read what wip init wrote: $($config.Output)"
            }
          }
          finally {
            Pop-Location
          }

          # A missing wip.yml has to be a one-line message and exit 1, not a stack trace.
          Push-Location $env:RUNNER_TEMP
          try {
            $missing = Invoke-Wip @('config')
            if ($missing.Code -ne 1) { throw "expected exit 1 with no wip.yml, got $($missing.Code)" }
            if ($missing.Output -match 'at Wip\.') {
              throw "error surfaced as a stack trace: $($missing.Output)"
            }
          }
          finally {
            Pop-Location
          }

          exit 0

      - name: Report binary size
        shell: pwsh
        run: |
          $size = (Get-Item artifacts/win-x64/wip.exe).Length
          "wip.exe: $([math]::Round($size / 1MB, 2)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
