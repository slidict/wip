name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the shipping target. ubuntu-latest is where the golden corpus
        # compares in full: it was generated by the Ruby build running inside WSL, so its
        # host-path expectations are Linux paths and those cases skip on Windows (see
        # tests/golden/README.md).
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build wip.slnx --configuration Release

      - name: Run tests
        run: dotnet test tests/Wip.Tests/Wip.Tests.csproj --configuration Release --no-build

  publish:
    name: Native AOT publish
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Publishing is its own job because it is what actually ships, and because the AOT
      # compiler is the only thing that reports trim and reflection problems. TreatWarnings
      # AsErrors is on, so an IL warning fails here rather than reaching a release.
      - name: Publish
        run: >
          dotnet publish src/Wip.Cli/Wip.Cli.csproj
          --configuration Release
          --runtime win-x64
          --output artifacts/win-x64

      - name: Smoke test
        shell: pwsh
        run: |
          $wip = "artifacts/win-x64/wip.exe"
          & $wip --help | Select-String -Quiet '^Commands:' || throw "help output missing commands"

          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/smoke" | Out-Null
          Push-Location "$env:RUNNER_TEMP/smoke"
          & (Join-Path $env:GITHUB_WORKSPACE $wip) init
          if ($LASTEXITCODE -ne 0) { throw "wip init failed" }
          & (Join-Path $env:GITHUB_WORKSPACE $wip) config | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "wip config could not read what wip init wrote" }
          Pop-Location

      - name: Report binary size
        shell: pwsh
        run: |
          $size = (Get-Item artifacts/win-x64/wip.exe).Length
          "wip.exe: $([math]::Round($size / 1MB, 2)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
