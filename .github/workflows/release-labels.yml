name: Release labels

# pull_request_target so Dependabot and fork PRs can be labelled (pull_request gets a read-only
# token for them). It is safe here: nothing checks out or runs PR code; the autolabeler only
# reads the PR title and the config from the base branch.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label the PR from its title
        uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7
        with:
          config-name: release-drafter.yml
