# End-to-end tests against a real WSLC installation.
#
# A separate workflow from Test, not a lesser one. Test must keep running on Linux with no
# WSLC at all -- that independence is what makes it fast and portable -- so the real-WSLC
# coverage lives here instead of being bolted onto it. It runs on every pull request, plus
# weekly (so a change in WSLC's own interface surfaces in a week nobody touched the
# repository) and on demand.
name: E2E (real WSLC)

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image the fixture builds on"
        required: false
        default: "alpine:3.20"
  schedule:
    - cron: "17 4 * * 1"
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Lifecycle against real WSLC
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      BASE_IMAGE: ${{ inputs.base_image || 'alpine:3.20' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      # The published binary, not `dotnet run`: this is the artifact users install, and AOT
      # compilation is the one step the managed test host cannot speak for.
      - name: Restore locked dependencies
        run: dotnet restore wip.slnx --locked-mode

      - name: Publish wip.exe
        run: >
          dotnet publish src/Wip.Cli/Wip.Cli.csproj
          --configuration Release
          --runtime win-x64 --no-restore
          --output artifacts/win-x64

      # The terminal the runner does not have. tests/e2e/PtyHarness creates one with ConPTY
      # and drives wip inside it, which is what makes the interactive path's terminal
      # behaviour -- tty, size, resize, Ctrl-C -- assertable here rather than only by hand.
      # Restores on its own: the harness is deliberately not in wip.slnx, so the locked
      # restore above does not cover it. It has no package references, so this costs nothing.
      - name: Publish the pseudo-console harness
        run: >
          dotnet publish tests/e2e/PtyHarness/PtyHarness.csproj
          --configuration Release
          --output artifacts/pty

      # Exercises the engine with a reviewed tiny scanner without registering a fake tool.
      - name: Publish the scan engine harness
        run: >
          dotnet publish tests/e2e/ScanHarness/ScanHarness.csproj
          --configuration Release
          --output artifacts/scan

      # WSLC is generally available in WSL 3.0.1 and later. --shutdown makes the update take
      # effect without a reboot the runner cannot give us.
      - name: Update WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # Show-Wsl runs wsl.exe by absolute path and returns its exit code and output;
          # scripts/Show-Wsl.ps1 says why each of those matters. Both steps that need it
          # dot-source the one copy.
          . "$env:GITHUB_WORKSPACE\scripts\Show-Wsl.ps1"

          # --web-download takes the stable GitHub distribution rather than the Store, and is
          # kept for that reason -- but hosted runners are intermittently denied that endpoint
          # too, and WSL then exits non-zero with WSL already installed and usable. A refusal
          # is reported and the job carries on, because `Verify wslc is available` is what
          # decides whether it can run. Anything else still fails here: -1 is what a refusal
          # and a broken install both return, so the output is the only thing that tells them
          # apart, and a half-applied update must not be left to surface as a lifecycle bug.
          $update = Show-Wsl @('--update', '--web-download')
          Show-Wsl @('--shutdown') | Out-Null
          Show-Wsl @('--version') | Out-Null
          if ($update.Code -ne 0) {
              # Every distinct reason line, in the order WSL printed them: the parenthesised
              # status is the cause a reader understands, the Error code is what they can
              # search for, and the same line often arrives on both stdout and stderr.
              # -Unique and -First are separate stages on purpose -- in one Select-Object,
              # -First is applied first and duplicates eat the budget.
              $reasons = $update.Text -split "\r?\n" | ForEach-Object { $_.Trim() } |
                  Where-Object { $_ -match 'Error code:|\(\d{3}\)' } |
                  Select-Object -Unique | Select-Object -First 3
              if (-not $reasons) {
                  throw "wsl --update --web-download exited $($update.Code) and named no refusal this step recognises; treat WSL as unusable and read the output above"
              }
              Write-Host "::warning title=WSL update was refused::wsl --update --web-download exited $($update.Code); the next step decides whether this job can run. WSL reported: $($reasons -join ' ')"
          }

      # Kept separate from the test itself so a runner image without WSLC reports that in one
      # line, instead of as a wip command failing for reasons that have nothing to do with wip.
      #
      # `wsl --update` installs wslc.exe next to wsl.exe, but the PATH this job inherited was
      # captured before that update ran, so a bare `wslc` can be missing even when the file is
      # there. So: look on PATH first, then in the places WSL installs itself, then across the
      # machine PATH as the registry has it now. Whatever is found is appended to GITHUB_PATH,
      # which is what lets both this script and wip's own `wslc: auto` resolution see it in the
      # steps that follow.
      - name: Verify wslc is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          . "$env:GITHUB_WORKSPACE\scripts\Show-Wsl.ps1"

          $candidates = @()
          if ($found = Get-Command wslc -ErrorAction SilentlyContinue) { $candidates += $found.Source }
          $candidates += Join-Path $env:ProgramFiles 'WSL\wslc.exe'
          $candidates += Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\wslc.exe'
          $candidates += Join-Path $env:SystemRoot 'System32\wslc.exe'

          # The MSIX build lives under WindowsApps, where the install location is only
          # discoverable through the package itself.
          $package = Get-AppxPackage -Name '*WindowsSubsystemForLinux*' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($package) { $candidates += Join-Path $package.InstallLocation 'wslc.exe' }

          # The machine PATH as it stands *now*, which is not the PATH this process started
          # with if the WSL update just appended to it.
          foreach ($dir in ([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';')) {
            if ($dir) { $candidates += Join-Path $dir 'wslc.exe' }
          }

          $wslc = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1

          if (-not $wslc) {
            Write-Host "--- wsl --status"
            # Caught, not allowed to throw: the step raises its own, more useful error about
            # wslc.exe a few lines below, and failing here would replace it.
            try { Show-Wsl @('--status') | Out-Null }
            catch { Write-Host "  (wsl --status failed: $_)" }
            Write-Host "--- $($env:ProgramFiles)\WSL"
            Get-ChildItem -LiteralPath (Join-Path $env:ProgramFiles 'WSL') -ErrorAction SilentlyContinue |
              Select-Object Name, Length | Format-Table | Out-String | Write-Host
            Write-Host "--- WSL appx package"
            $package | Format-List Name, Version, InstallLocation | Out-String | Write-Host
            Write-Host "--- candidates checked"
            $candidates | Sort-Object -Unique | Write-Host
            throw "wslc.exe was not found after 'wsl --update --web-download'. Use stable WSL 3.0.1 or later."
          }

          Write-Host "wslc: $wslc"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $wslc)
          Add-Content -Path $env:GITHUB_ENV -Value "WSLC_EXE=$wslc"
          & $wslc version
          if ($LASTEXITCODE -ne 0) { throw "wslc version exited $LASTEXITCODE" }

      - name: Run the lifecycle end-to-end
        shell: pwsh
        run: >
          pwsh tests/e2e/run-e2e.ps1
          -Wip artifacts/win-x64/wip.exe
          -Wslc $env:WSLC_EXE
          -BaseImage $env:BASE_IMAGE
          -PtyHarness artifacts/pty/pty-harness.exe
          -ScanHarness artifacts/scan/scan-fixture.exe

      # The pinned ZAP image is large; keep its download and scan off unrelated PRs.
      - name: Run the real ZAP adapter
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 20
        shell: pwsh
        run: >
          pwsh tests/e2e/zap-scan.ps1
          -Wip artifacts/win-x64/wip.exe
          -Wslc $env:WSLC_EXE

      # The script prints its own diagnostics when an assertion fails; this covers the cases
      # it never reached -- a cancelled step, a crash, a hung container.
      - name: Diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # Show-Wsl runs wsl.exe by absolute path and returns its exit code and output;
          # scripts/Show-Wsl.ps1 says why each of those matters. Both steps that need it
          # dot-source the one copy.
          . "$env:GITHUB_WORKSPACE\scripts\Show-Wsl.ps1"

          # Caught individually: this step runs under if: failure() to collect evidence, so a
          # launcher that cannot be resolved must not stop it reaching the wslc output below.
          foreach ($wslArgs in @(@('--version'), @('--status'))) {
              try { Show-Wsl $wslArgs | Out-Null }
              catch { Write-Host "  (wsl $($wslArgs -join ' ') failed: $_)" }
          }

          # wslc.exe writes UTF-8, so it is left to print for itself under the step's default.
          wslc version
          wslc list --all
          exit 0
