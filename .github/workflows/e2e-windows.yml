# End-to-end tests against a real WSLC installation.
#
# A separate workflow from Test, not a lesser one. Test must keep running on Linux with no
# WSLC at all -- that independence is what makes it fast and portable -- so the real-WSLC
# coverage lives here instead of being bolted onto it. It runs on every pull request, plus
# weekly (so a change in WSLC's own interface surfaces in a week nobody touched the
# repository) and on demand.
name: E2E (real WSLC)

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image the fixture builds on"
        required: false
        default: "alpine:3.20"
  schedule:
    - cron: "17 4 * * 1"
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Lifecycle against real WSLC
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      BASE_IMAGE: ${{ inputs.base_image || 'alpine:3.20' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      # The published binary, not `dotnet run`: this is the artifact users install, and AOT
      # compilation is the one step the managed test host cannot speak for.
      - name: Publish wip.exe
        run: >
          dotnet publish src/Wip.Cli/Wip.Cli.csproj
          --configuration Release
          --runtime win-x64
          --output artifacts/win-x64

      # WSLC ships in the pre-release WSL channel today. --shutdown makes the update take
      # effect without a reboot the runner cannot give us.
      - name: Update WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # wsl.exe writes UTF-16LE, and every attempt to fix that through
          # [Console]::OutputEncoding came back garbled in these steps -- the runner starts
          # pwsh with no console of its own, so the property has nothing to govern. Reading
          # the pipe directly does not depend on any of that: StandardOutputEncoding states
          # the encoding for this one child, whatever the host's console is. Returns the
          # child's exit code, since the caller can no longer read $LASTEXITCODE for it.
          function Show-Wsl([string[]] $WslArgs) {
              $psi = [System.Diagnostics.ProcessStartInfo]::new('wsl.exe')
              foreach ($argument in $WslArgs) { $psi.ArgumentList.Add($argument) }
              $psi.UseShellExecute = $false
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $psi.StandardOutputEncoding = [System.Text.Encoding]::Unicode
              $psi.StandardErrorEncoding = [System.Text.Encoding]::Unicode

              $process = [System.Diagnostics.Process]::Start($psi)
              $out = $process.StandardOutput.ReadToEnd()
              $err = $process.StandardError.ReadToEnd()
              $process.WaitForExit()

              foreach ($text in @($out, $err)) { if ($text.Trim()) { Write-Host $text.TrimEnd() } }
              return $process.ExitCode
          }

          $code = Show-Wsl @('--update', '--pre-release')
          Show-Wsl @('--shutdown') | Out-Null
          Show-Wsl @('--version') | Out-Null
          if ($code -ne 0) { throw "wsl --update --pre-release exited $code" }

      # Kept separate from the test itself so a runner image without WSLC reports that in one
      # line, instead of as a wip command failing for reasons that have nothing to do with wip.
      #
      # `wsl --update` installs wslc.exe next to wsl.exe, but the PATH this job inherited was
      # captured before that update ran, so a bare `wslc` can be missing even when the file is
      # there. So: look on PATH first, then in the places WSL installs itself, then across the
      # machine PATH as the registry has it now. Whatever is found is appended to GITHUB_PATH,
      # which is what lets both this script and wip's own `wslc: auto` resolution see it in the
      # steps that follow.
      - name: Verify wslc is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $candidates = @()
          if ($found = Get-Command wslc -ErrorAction SilentlyContinue) { $candidates += $found.Source }
          $candidates += Join-Path $env:ProgramFiles 'WSL\wslc.exe'
          $candidates += Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\wslc.exe'
          $candidates += Join-Path $env:SystemRoot 'System32\wslc.exe'

          # The MSIX build lives under WindowsApps, where the install location is only
          # discoverable through the package itself.
          $package = Get-AppxPackage -Name '*WindowsSubsystemForLinux*' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($package) { $candidates += Join-Path $package.InstallLocation 'wslc.exe' }

          # The machine PATH as it stands *now*, which is not the PATH this process started
          # with if the WSL update just appended to it.
          foreach ($dir in ([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';')) {
            if ($dir) { $candidates += Join-Path $dir 'wslc.exe' }
          }

          $wslc = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1

          if (-not $wslc) {
            Write-Host "--- wsl --status"
            $status = [System.Diagnostics.ProcessStartInfo]::new('wsl.exe')
            $status.ArgumentList.Add('--status')
            $status.UseShellExecute = $false
            $status.RedirectStandardOutput = $true
            $status.StandardOutputEncoding = [System.Text.Encoding]::Unicode
            $reader = [System.Diagnostics.Process]::Start($status)
            Write-Host $reader.StandardOutput.ReadToEnd().TrimEnd()
            $reader.WaitForExit()
            Write-Host "--- $($env:ProgramFiles)\WSL"
            Get-ChildItem -LiteralPath (Join-Path $env:ProgramFiles 'WSL') -ErrorAction SilentlyContinue |
              Select-Object Name, Length | Format-Table | Out-String | Write-Host
            Write-Host "--- WSL appx package"
            $package | Format-List Name, Version, InstallLocation | Out-String | Write-Host
            Write-Host "--- candidates checked"
            $candidates | Sort-Object -Unique | Write-Host
            throw "wslc.exe was not found after 'wsl --update --pre-release'. WSLC may not ship on this runner image yet."
          }

          Write-Host "wslc: $wslc"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $wslc)
          Add-Content -Path $env:GITHUB_ENV -Value "WSLC_EXE=$wslc"
          & $wslc version
          if ($LASTEXITCODE -ne 0) { throw "wslc version exited $LASTEXITCODE" }

      - name: Run the lifecycle end-to-end
        shell: pwsh
        run: >
          pwsh tests/e2e/run-e2e.ps1
          -Wip artifacts/win-x64/wip.exe
          -Wslc $env:WSLC_EXE
          -BaseImage $env:BASE_IMAGE

      # The script prints its own diagnostics when an assertion fails; this covers the cases
      # it never reached -- a cancelled step, a crash, a hung container.
      - name: Diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # wsl.exe writes UTF-16LE, and every attempt to fix that through
          # [Console]::OutputEncoding came back garbled in these steps -- the runner starts
          # pwsh with no console of its own, so the property has nothing to govern. Reading
          # the pipe directly does not depend on any of that: StandardOutputEncoding states
          # the encoding for this one child, whatever the host's console is. Returns the
          # child's exit code, since the caller can no longer read $LASTEXITCODE for it.
          function Show-Wsl([string[]] $WslArgs) {
              $psi = [System.Diagnostics.ProcessStartInfo]::new('wsl.exe')
              foreach ($argument in $WslArgs) { $psi.ArgumentList.Add($argument) }
              $psi.UseShellExecute = $false
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $psi.StandardOutputEncoding = [System.Text.Encoding]::Unicode
              $psi.StandardErrorEncoding = [System.Text.Encoding]::Unicode

              $process = [System.Diagnostics.Process]::Start($psi)
              $out = $process.StandardOutput.ReadToEnd()
              $err = $process.StandardError.ReadToEnd()
              $process.WaitForExit()

              foreach ($text in @($out, $err)) { if ($text.Trim()) { Write-Host $text.TrimEnd() } }
              return $process.ExitCode
          }

          Show-Wsl @('--version') | Out-Null
          Show-Wsl @('--status') | Out-Null

          # wslc.exe writes UTF-8, so it is left to print for itself under the step's default.
          wslc version
          wslc list --all
          exit 0
