name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version segment to bump.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump project version
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false keeps checkout from writing a token into .git/config,
      # so no credential is left lying around for the rest of the job. The one step that
      # needs to authenticate -- the push below -- carries its own header instead.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Directory.Build.props is the single source of truth for the version: the SDK stamps
      # it into the assembly, and the release workflow releases whatever version it finds
      # here, creating the tag itself. The release workflow updates the Scoop manifest only
      # after the corresponding archive exists and its digest can be verified.
      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ -z "$current" ]; then
            echo "Could not find <Version> in Directory.Build.props" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump value" >&2; exit 1 ;;
          esac

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Update version
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          sed -i "s|<Version>${CURRENT}</Version>|<Version>${NEXT}</Version>|" Directory.Build.props
          grep -q "<Version>${NEXT}</Version>" Directory.Build.props

      - name: Commit version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "bump-version-v${NEXT}"
          git add Directory.Build.props
          git commit -m "chore: bump version to v${NEXT}"

          # Passed on the command line rather than written to .git/config, so the
          # credential lives for the length of this one command. Pushing to `origin`
          # rather than to an authenticated URL keeps the remote-tracking refs that
          # --force-with-lease compares against.
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${header}" \
            push --force-with-lease origin "bump-version-v${NEXT}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "bump-version-v${NEXT}" \
            --title "chore: bump version to v${NEXT}" \
            --body "Bump wip version to v${NEXT}. Merging this builds v${NEXT} and opens a pull request updating the Scoop manifest with its verified digest. Merging *that* pull request is what actually publishes the release, submits it to WinGet, and posts the announcement to X."
