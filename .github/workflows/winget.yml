name: WinGet

# Called by release.yml rather than triggered by `release: published`. A release created
# with GITHUB_TOKEN does not start another workflow run, so an event-based trigger would
# leave every automated release silently unsubmitted. Calling it directly makes the handoff
# part of the release job's own graph.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag the assets belong to (e.g. v2.0.0).
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        description: slidict-bot classic PAT with public_repo scope.
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v2.0.0).
        required: false
        type: string
      repair_pr:
        description: Existing microsoft/winget-pkgs PR number to repair instead of creating a new PR.
        required: false
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: Submit to winget-pkgs
    runs-on: ubuntu-latest

    # Naming an environment lets WINGET_TOKEN live there instead of as a plain repository
    # secret, so required reviewers can gate every use of it. With no protection rules
    # configured this changes nothing, so it is safe to leave in place until someone sets
    # them up.
    environment: winget

    env:
      # The secrets context cannot be read from an `if:` condition, so it is lifted into env
      # here and the steps below branch on that instead.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Resolve version
        if: inputs.repair_pr == ''
        id: resolve
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Keep the bot's default branch current before winget-releaser creates its submission
      # branch. Otherwise a long-lived fork can make the pull request include unrelated old
      # commits or fail because its base has fallen behind microsoft/winget-pkgs.
      - name: Sync slidict-bot winget-pkgs fork
        if: env.WINGET_TOKEN != '' && inputs.repair_pr == ''
        env:
          GH_TOKEN: ${{ env.WINGET_TOKEN }}
        run: |
          set -euo pipefail

          login=$(gh api user --jq .login)
          if [[ "$login" != "slidict-bot" ]]; then
            echo "::error::WINGET_TOKEN authenticates as $login, not slidict-bot."
            exit 1
          fi

          default_branch=$(gh api repos/microsoft/winget-pkgs --jq .default_branch)
          gh api --method POST repos/slidict-bot/winget-pkgs/merge-upstream \
            --field "branch=$default_branch"

      # Opens a pull request against microsoft/winget-pkgs from slidict-bot/winget-pkgs.
      # GITHUB_TOKEN cannot do this -- it has no rights on another repository -- so both the
      # fork sync above and winget-releaser use slidict-bot's classic public_repo PAT. Without
      # the secret these steps are skipped rather than failing every release, and the step
      # below prints what to set up.
      - name: Create winget-pkgs pull request
        id: winget_submission
        if: env.WINGET_TOKEN != '' && inputs.repair_pr == ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Slidict.Wip
          version: ${{ steps.resolve.outputs.version }}
          installers-regex: '^wip-.*-win-x64\.zip$'
          release-tag: ${{ inputs.tag }}
          # Keep the coarse classic PAT isolated on the dedicated bot account.
          fork-user: slidict-bot
          token: ${{ env.WINGET_TOKEN }}

      # Komac v2.16.0 still produces manifest schema 1.12.0, but winget-pkgs
      # now requires 1.28.0. Amend the generated PR rather than opening another.
      # workflow_dispatch(repair_pr) also repairs an existing PR such as #448242.
      - name: Upgrade WinGet manifest schema to 1.28.0
        if: env.WINGET_TOKEN != '' && (inputs.repair_pr != '' || steps.winget_submission.outputs.pr-url != '')
        env:
          GH_TOKEN: ${{ env.WINGET_TOKEN }}
          CREATED_PR_URL: ${{ steps.winget_submission.outputs.pr-url }}
          REPAIR_PR: ${{ inputs.repair_pr }}
        run: |
          set -euo pipefail

          pr_number="${REPAIR_PR:-${CREATED_PR_URL##*/}}"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid WinGet PR number: $pr_number"
            exit 1
          fi

          pr=$(gh api "repos/microsoft/winget-pkgs/pulls/$pr_number")
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")
          head_ref=$(jq -r '.head.ref' <<< "$pr")
          if [[ "$head_repo" != "slidict-bot/winget-pkgs" ]]; then
            echo "::error::Unexpected PR head repository: $head_repo"
            exit 1
          fi

          version=$(jq -r '.title | capture("version (?<version>[0-9][^ ]*)").version' <<< "$pr")
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([-.][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Unexpected package version: $version"
            exit 1
          fi

          for name in Slidict.Wip.installer.yaml Slidict.Wip.locale.en-US.yaml Slidict.Wip.yaml; do
            path="manifests/s/Slidict/Wip/$version/$name"
            file=$(gh api "repos/$head_repo/contents/$path?ref=$head_ref")
            sha=$(jq -r .sha <<< "$file")
            content=$(jq -r .content <<< "$file" | base64 -d)
            if [[ "$content" != *1.12.0* ]]; then
              echo "Schema already updated: $path"
              continue
            fi
            updated="${content//1.12.0/1.28.0}"
            encoded=$(printf '%s\n' "$updated" | base64 -w0)
            gh api --method PUT "repos/$head_repo/contents/$path" \
              -f "message=fix(winget): upgrade manifest schema to 1.28.0" \
              -f "content=$encoded" -f "sha=$sha" -f "branch=$head_ref" >/dev/null
            echo "Updated: $path"
          done

      - name: Explain a skipped submission
        if: env.WINGET_TOKEN == ''
        run: |
          {
            echo "WINGET_TOKEN is not set, so no winget-pkgs pull request was opened."
            echo ""
            echo "To enable it, once:"
            echo ""
            echo "1. Fork microsoft/winget-pkgs as slidict-bot."
            echo "2. Create a **classic** PAT on slidict-bot with the \`public_repo\` scope and"
            echo "   an expiry. Fine-grained tokens are not supported, and GITHUB_TOKEN has no"
            echo "   rights on another repository."
            echo "3. Store it as WINGET_TOKEN on the \`winget\` environment, so required"
            echo "   reviewers can gate each use."
            echo ""
            echo "Submissions can also be made by hand with \`wingetcreate submit <manifests>\`,"
            echo "pointing at a directory holding the three manifest files. That needs no stored"
            echo "credential: with no --token it authenticates through the browser instead."
          } >> "$GITHUB_STEP_SUMMARY"
