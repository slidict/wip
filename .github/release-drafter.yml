name-template: 'Unreleased'
tag-template: 'v$NEXT_PATCH_VERSION'
template: |
  $CHANGES

  ## Contributors

  $CONTRIBUTORS

# Sections come from the PR title, read as a conventional commit header
# (`feat(scope)!: ...`), so no labels are needed.
category-template: '### $TITLE'
categories:
  - title: '✨ New Features'
    when:
      conventional:
        type: 'feat'
  - title: '🐛 Bug Fixes'
    when:
      conventional:
        type: 'fix'
  - title: '🧰 Maintenance'
    when:
      - conventional:
          types: ['chore', 'ci', 'docs', 'build', 'perf', 'test', 'refactor', 'style', 'revert']
      # Dependabot's NuGet PRs are titled "Bump ..." with no prefix.
      - label: 'dependencies'
  # No `when`: everything the sections above did not take.
  - title: '🛸 Other Changes'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
no-changes-template: '- No changes'
