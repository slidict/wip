AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
Metrics/MethodLength:
  Max: 20
Metrics/AbcSize:
  Max: 25
Metrics/ClassLength:
  Max: 160
  Exclude:
    - lib/wip/cli.rb
Metrics/BlockLength:
  Exclude:
    - spec/**/*
Layout/LineLength:
  Max: 120
