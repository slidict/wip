services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        RUBY_VERSION: "3.4"
    working_dir: /app
    command: ["bin/rails", "server", "-b", "0.0.0.0"]
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://db/app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - db
      - cache
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=secret
    restart: no

  cache:
    image: redis:7
    restart: on-failure:3

  seeder:
    image: alpine:3.20
    command: sh -c "echo seeding"
    profiles:
      - tools
